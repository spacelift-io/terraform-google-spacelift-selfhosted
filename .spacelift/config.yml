version: 2
module_version: "3.1.0"

tests:
  - name: Test infrastructure creation
    runner_image: public.ecr.aws/spacelift/runner-terraform:gcp-latest
    project_root: "examples/simple"
    environment:
      TF_VAR_region: europe-west3
      TF_VAR_project: self-hosted-v3-testing
    before_destroy:
      # Every test install shares this project-wide grant. Destroying it breaks the
      # destroy of any test running at the same time, so leave it in the project.
      - tofu state rm 'module.spacelift.module.db[0].google_project_iam_member.servicenetworking_role'
